<!doctype html><html><head><meta charset="utf-8"><style>
{% include "base.css" %}
body { background: {{ '#121212' if dark else '#f3f3f3' }}; color: {{ '#eee' if dark else '#111' }}; min-height: 600px; }
.top { padding: 16px; font-weight: 600; border-bottom: 1px solid {{ '#333' if dark else '#ddd' }}; }
.msg { margin: 12px 14px; padding: 12px 14px; border-radius: 16px; max-width: 320px; font-size: 15px; line-height: 1.4;
       background: {{ '#2a2a2a' if dark else '#fff' }}; white-space: pre-line; }
.time { font-size: 11px; opacity: .6; margin: 0 16px; }
</style></head><body>
<div class="top">{{ sender }}</div>
{% if decoys %}
<p class="time">Yesterday</p>
<div class="msg">{{ decoy_otp }} is your OTP for login. Valid for 5 mins. Do not share it with anyone.</div>
<div class="msg">Avl Bal in your A/c is {{ currency }}{{ balance }} as on today.</div>
{% endif %}
{% if legit %}<div class="msg">{{ legit }}</div>{% endif %}
<p class="time">Today</p>
<div class="msg">{{ sms }}</div>
<div class="wm">SYNTHETIC</div>
</body></html>
